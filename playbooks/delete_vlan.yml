- name: Delete VLAN
  hosts: routers
  gather_facts: no

  tasks:

    - name: Remove Access VLAN from Port
      cisco.ios.ios_config:
        parents: "interface {{ access_interface }}"
        lines:
          - no switchport access vlan

    - name: Check VLAN Interface
      cisco.ios.ios_command:
        commands:
          - "show ip interface brief | include {{ interface_name }}"
      register: vlan_interface_check
      changed_when: false
      failed_when: false

    - name: Delete VLAN Interface
      cisco.ios.ios_config:
        lines:
          - "no interface {{ interface_name }}"
      when: vlan_interface_check.stdout[0] | length > 0

    - name: Delete VLAN
      cisco.ios.ios_config:
        lines:
          - "no vlan {{ vlan_id }}"

    - name: Save Configuration
      cisco.ios.ios_config:
        save_when: modified
